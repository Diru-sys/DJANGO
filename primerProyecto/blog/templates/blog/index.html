<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>
    <style>
        * {
            text-align: center;
        }
    </style>
</head>
<body>
    {% block main %}
    <main>
        <h1>Mi pagina principal</h1>
        {% for post in posts %}
            <a href="{% url 'detalles' pk=post.pk %}"> {{post.titulo}} ({{post.autor}})</a> <br>
        {% endfor %}
        <hr>
    </main>
    <footer>
        Footer página
    </footer>
    {% endblock %}
    <hr>
    <a href="{% url 'autores' %}">Autores</a>
</body>
</html>
