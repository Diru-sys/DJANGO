<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>
    <style>
        * {
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <a href="{% url 'principal' %}">Inicio</a> - 
        <a href="{% url 'autores' %}">Autores</a> - 
    </header>
    <hr>
    <main>
        {% block main %}
            <h1>Mi página principal</h1>
            {% for post in posts %}
                <a href="{% url 'detallesEntrada' pk=post.pk %}">{{ post.titulo }}</a> <a href="{% url 'entradasAutor' pk=post.autor.pk%}"> ({{ post.autor }})</a> <br>
            {% endfor %}
            <br>
            <hr>
            <h1>Categorías</h1>
            {%for categoria in categorias%}
                <a href="{% url 'detallesCategoria' pk=categoria.pk %}">{{categoria.nombre}}</a> <br>
            {% endfor %}
        {% endblock %}
    </main>
</body>
</html>
