{% extends 'blog/index.html' %}

{% block main %}
    <h1>Detalles de la entrada</h1>
    <p><strong>Título: </strong>{{ posts.titulo }}</p>
    <p><strong>Autor: </strong>{{ posts.autor }}</p>
    <p><strong>Categoria: </strong>{{ posts.categoria}}</p>
    <p><strong>Cuerpo: </strong>{{ posts.cuerpo }}</p>
    <p><strong>Fecha de publicación: </strong>{{ posts.fecha_publicacion }}</p>
    <p><strong>Imagen: </strong><img src="{{ posts.imagen.url }}" alt="{{ posts.titulo }}" style="max-width: 400px;"></p>
{% endblock %}
