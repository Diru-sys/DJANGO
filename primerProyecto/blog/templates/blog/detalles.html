{% extends 'blog/index.html' %}

{% block main %}

    <p><strong>Título: </strong>{{ post.titulo }}</p>
    <p><strong>Autor: </strong>{{ post.autor }}</p>
    <p><strong>Cuerpo: </strong>{{ post.cuerpo }}</p>
    <p><strong>Fecha de publicación: </strong>{{ post.fecha_publicacion }}</p>
{% endblock %}
